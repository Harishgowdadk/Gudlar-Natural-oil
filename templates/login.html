{% extends "base.html" %}
{% block title %}Login | Gudlar{% endblock %}
{% block content %}
<div class="container">
  <div class="form-card">
    <h2>Welcome back</h2>
    <p class="sub">Log in to place your order.</p>
    <form method="POST">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log In</button>
    </form>
    <div class="form-foot">
      New here? <a href="{{ url_for('auth.register', next=request.args.get('next')) }}">Create an account</a><br>
      <a href="{{ url_for('admin.login') }}" style="font-weight:500;">Admin login</a>
    </div>
  </div>
</div>
{% endblock %}
