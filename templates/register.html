{% extends "base.html" %}
{% block title %}Create Account | Gudlar{% endblock %}
{% block content %}
<div class="container">
  <div class="form-card">
    <h2>Create your account</h2>
    <p class="sub">Register once, order anytime on WhatsApp.</p>
    <form method="POST">
      <div class="field">
        <label for="full_name">Full Name</label>
        <input type="text" id="full_name" name="full_name" value="{{ form.full_name or '' }}" required autofocus>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ form.email or '' }}" required>
      </div>
      <div class="field">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" value="{{ form.phone or '' }}" data-phone
               pattern="[6-9][0-9]{9}" maxlength="10" inputmode="numeric"
               title="Enter a 10-digit mobile number" placeholder="10-digit mobile number" required>
        <small>Only 10 digits allowed.</small>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" minlength="6" required>
      </div>
      <div class="field">
        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" minlength="6" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Register</button>
    </form>
    <div class="form-foot">
      Already registered? <a href="{{ url_for('auth.login', next=request.args.get('next')) }}">Log in</a>
    </div>
  </div>
</div>
{% endblock %}
